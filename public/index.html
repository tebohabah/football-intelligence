<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a0f">

  <title>Football Intelligence Engine</title>

  <meta
    name="description"
    content="AI-powered football match intelligence, probability analysis, expected goals and statistical forecasts."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/styles.css">
</head>

<body>

<div class="app">

  <!-- TOP NAVIGATION -->
  <header class="topbar">

    <div class="brand">
      <span class="brand-mark">FI</span>

      <div>
        <strong>FOOTBALL</strong>
        <span>INTELLIGENCE ENGINE</span>
      </div>
    </div>

    <nav class="main-nav">
      <button class="nav active" data-page="dashboard">
        Dashboard
      </button>

      <button class="nav" data-page="performance">
        Performance
      </button>

      <button class="nav" data-page="methodology">
        Methodology
      </button>
    </nav>

    <div class="top-actions">
      <span class="live-dot"></span>
      <span id="modeBadge">CONNECTING</span>
    </div>

  </header>


  <!-- MAIN APPLICATION -->
  <main id="main">

    <div class="loading-screen">

      <div class="loader"></div>

      <h2>Initializing Football Intelligence</h2>

      <p>
        Connecting to the live fixture and prediction engine...
      </p>

    </div>

  </main>


  <!-- MATCH MODAL -->
  <div id="modal" class="modal hidden">

    <div class="modal-card">

      <button
        class="close"
        onclick="closeModal()"
        aria-label="Close"
      >
        ×
      </button>

      <div id="modalContent"></div>

    </div>

  </div>


  <!-- FOOTER -->
  <footer>

    <div>
      <b>FOOTBALL INTELLIGENCE ENGINE</b>
      <br>
      <small>
        Probabilities, not promises.
      </small>
    </div>

    <div class="footer-note">
      Statistical forecasts are estimates.
      No football outcome is guaranteed.
    </div>

  </footer>

</div>

<script src="/app.js"></script>

</body>
</html>
